name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GEODE_SDK: ${{ github.workspace }}/geode-sdk
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Geode SDK
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: v1.3.10
          path: geode-sdk

      - name: Setup Geode binaries and CLI
        run: |
          curl -sL -o geode.zip https://github.com/geode-sdk/geode/releases/download/v1.3.10/geode-v1.3.10-win.zip
          mkdir geode-sdk/bin/1.3.10
          tar -xf geode.zip -C geode-sdk/bin/1.3.10 Geode.lib
          curl -sL -o cli.zip https://github.com/geode-sdk/cli/releases/download/v2.6.5/geode-cli-v2.6.5-win.zip
          mkdir cli
          tar -xf cli.zip -C cli

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure
        run: cmake -B build -T host=x64 -A Win32 "-DGEODE_CLI=${{ github.workspace }}/cli/geode.exe"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClickBetweenFrames
          path: |
            build/Release/ClickBetweenFrames.dll
            build/anticroom.click-between-frames.geode
          if-no-files-found: error

      - name: Move nightly tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git tag -f nightly ${{ github.sha }}
          git push -f origin nightly

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          body: |
            Automated build of `${{ github.sha }}`.

            ${{ github.event.head_commit.message }}
          files: |
            build/Release/ClickBetweenFrames.dll
            build/anticroom.click-between-frames.geode
          prerelease: true
